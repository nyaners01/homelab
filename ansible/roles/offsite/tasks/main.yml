- name: Каталог rclone
  ansible.builtin.file:
    path: "{{ offsite_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: deb пакет rclone
  ansible.builtin.get_url:
    url: https://github.com/rclone/rclone/releases/download/{{ offsite_rclone_version }}/rclone-{{ offsite_rclone_version }}-linux-arm64.deb
    checksum: sha256:https://github.com/rclone/rclone/releases/download/{{ offsite_rclone_version }}/SHA256SUMS
    dest: "{{ offsite_deb_dest }}"
    mode: '0600'
  ignore_errors: "{{ ansible_check_mode }}"

- name: rclone из релиза на GitHub
  ansible.builtin.apt:
    deb: "{{ offsite_deb_dest }}"
    allow_downgrade: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Каталог для конфига rclone
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    owner: root
    group: root
    mode: "0700"

# diff: false, иначе --diff напечатает токены открытым текстом
- name: Конфиг rclone
  diff: false
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /root/.config/rclone/rclone.conf
    owner: root
    group: root
    mode: '0600'
    # Ansible возвращает конфиг к шаблону, rclone потом снова обновляет токен;
    # changed при повторном прогоне ожидаем, чтобы иметь возможность обновить данные при надобности
    force: true

- name: Скрипт для отправки бэкапов
  ansible.builtin.template:
    src: homelab-offsite.sh.j2
    dest: /usr/local/sbin/homelab-offsite
    owner: root
    group: root
    mode: "0750"

- name: Служба homelab-offsite
  ansible.builtin.template:
    src: homelab-offsite.service.j2
    dest: "/etc/systemd/system/homelab-offsite.service"
    owner: root
    group: root
    mode: "0644"
  notify: Перечитать systemd

- name: Каталог для override homelab-backup.service
  ansible.builtin.file:
    path: /etc/systemd/system/homelab-backup.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Override homelab-backup.service
  ansible.builtin.template:
    src: homelab-offsite.conf.j2
    dest: /etc/systemd/system/homelab-backup.service.d/homelab-offsite.conf
    owner: root
    group: root
    mode: "0644"
  notify: Перечитать systemd
