argument_specs:
  main:
    short_description: "Отправка данных по rclone"
    options:
      offsite_source_dirs:
        type: list
        elements: dict
        required: true
        description:
          - "Папки для отправки"
        options:
          path:
            type: path
            required: true
            description: "Абсолютный путь к директории"
          dest_path:
            type: str
            required: true
            description: "Путь в rclone"
          retention_days:
            type: int
            required: true
            description: "Сколько дней хранить"
