---
- name: Пакеты для deb822_repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Удалить старый формат репозитория Docker
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Репозиторий Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
    suites: ["{{ ansible_facts.distribution_release | lower }}"]
    components: [stable]
    architectures: "{{ docker_apt_arch }}"
    signed_by: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
    state: present
    enabled: true
  vars:
    docker_apt_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
  register: docker_repo

- name: Пакеты Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: "{{ docker_repo.changed }}"

- name: Настройки демона Docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Перезапустить Docker

- name: Docker запущен и включён при загрузке
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
